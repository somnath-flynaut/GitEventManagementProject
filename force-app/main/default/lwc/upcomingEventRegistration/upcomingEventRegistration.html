<template>
    <div class="event-container">
        <!-- Heading for Upcoming Events -->
        <h1 class="heading">Upcoming Events</h1>

        <div class="event-grid-container" >
            <template if:true={events}>
                <div class="grid">
                    <template for:each={events} for:item="event">
                        <div key={event.id} class="event-card">
                            <!-- Event Image -->
                            <img src={event.imageUrl} alt="Event Image" class="event-image" if:true={event.imageUrl} />
                            
                            <div class="event-details">
                                <h3>{event.name}</h3>
                                <p>Date: {event.date}</p>
                                <p>Location: {event.location}</p>
                                <lightning-button
                                    label="View Details"
                                    variant="brand"
                                    data-id={event.id}
                                    onclick={handleViewDetails}>
                                </lightning-button>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
            <template if:false={events}>
                <p class="no-events">No upcoming events found.</p>
            </template>
        </div>
    </div>
</template>
